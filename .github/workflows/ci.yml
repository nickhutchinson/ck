  windows_mingw:
    name: Windows MinGW / ${{ matrix.arch }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            compiler: gcc
            runner: windows-2025
            msys_subsystem: UCRT64
            CC: x86_64-w64-mingw32-gcc
            AR: x86_64-w64-mingw32-gcc-ar
          - arch: i686
            compiler: gcc
            runner: windows-2025
            msys_subsystem: MINGW32
            CC: i686-w64-mingw32-gcc
            AR: i686-w64-mingw32-gcc-ar
          - arch: aarch64
            compiler: clang
            runner: windows-11-arm
            msys_subsystem: CLANGARM64
            CC: aarch64-w64-mingw32-clang
            AR: aarch64-w64-mingw32-llvm-ar
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msys_subsystem }}
          install: git make
          pacboy: gcc:p clang:p

      - name: Compiler version
        run: ${{ matrix.CC }} --version

      - name: Build
        run: |
          ./tools/ci-build.sh \
            --cores=2 \
            --platform=${{ matrix.arch }} \
            CC=${{ matrix.CC }} \
            AR=${{ matrix.AR }}

      - name: Test
        run: make check
