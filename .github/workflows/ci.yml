name: CI
on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
    inputs:
      fast:
        description: 'Fast build (Linux only)'
        type: boolean
        default: false

jobs:
  linux_arm32:
    name: Linux arm32 / ${{ matrix.cc }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            compiler: arm-linux-gnueabihf-gcc -march=armv7-a+fp -g
          - cc: clang
            compiler: clang --target=arm-linux-gnueabihf -march=armv7-a+fp -g
    steps:
      - uses: actions/checkout@v7

      - name: Inspect runner and rule out emulation
        shell: bash
        run: |
          uname -a
          lscpu
          test "$(uname -m)" = aarch64
          if ! mountpoint -q /proc/sys/fs/binfmt_misc; then
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          fi
          for handler in /proc/sys/fs/binfmt_misc/*; do
            case "$handler" in
              */register|*/status) continue ;;
            esac
            test -f "$handler" || continue
            echo "binfmt_misc handler: $handler"
            cat "$handler"
          done
          # LLVM bitcode handlers are unrelated; disable all handlers for this job
          # so successful ARM32 execution cannot be supplied by an emulator.
          echo 0 | sudo tee /proc/sys/fs/binfmt_misc/status
          test "$(cat /proc/sys/fs/binfmt_misc/status)" = disabled

      - name: Inspect apt sources and install ARMHF compiler and libc
        shell: bash
        run: |
          dpkg --print-architecture
          dpkg --print-foreign-architectures
          test "$(dpkg --print-architecture)" = arm64
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            test -f "$source" || continue
            echo "apt source: $source"
            cat "$source"
          done
          sudo dpkg --add-architecture armhf
          # The hosted Azure mirror lacks ARMHF; Ubuntu ports serves both architectures.
          sudo tee /etc/apt/sources.list.d/ubuntu.sources <<'EOF'
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: resolute resolute-updates resolute-backports resolute-security
          Components: main universe restricted multiverse
          Architectures: arm64 armhf
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          apt-cache policy gcc-arm-linux-gnueabihf libc6:armhf libc6-dev:armhf
          sudo apt-get install -y gcc-arm-linux-gnueabihf clang libc6:armhf libc6-dev:armhf file gdb-multiarch
          test -r /lib/ld-linux-armhf.so.3
          file /lib/ld-linux-armhf.so.3

      - name: Compiler version
        run: ${{ matrix.compiler }} --version

      - name: Prepare failure diagnostics
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/arm32-diagnostics/cores"
          : > "$RUNNER_TEMP/arm32-diagnostics/results.tsv"
          sudo sysctl -w kernel.core_pattern="$RUNNER_TEMP/arm32-diagnostics/cores/core.%E.%p.%t"
          uname -a > "$RUNNER_TEMP/arm32-diagnostics/system.txt"
          dpkg-query -W > "$RUNNER_TEMP/arm32-diagnostics/packages.tsv"

      - name: Build CK
        shell: bash
        env:
          CC: ${{ matrix.compiler }}
        run: |
          ./tools/ci-build.sh AR=arm-linux-gnueabihf-ar --platform=arm --cores=2 \
            2>&1 | tee "$RUNNER_TEMP/arm32-diagnostics/build.log"

      - name: Build tests
        shell: bash
        run: |
          make -j2 regressions 2>&1 | tee "$RUNNER_TEMP/arm32-diagnostics/build-tests.log"
          file src/libck.so regressions/ck_pr/validate/ck_pr_cas

      - name: Run tests natively
        shell: bash
        env:
          CK_TEST_RESULTS: ${{ runner.temp }}/arm32-diagnostics/results.tsv
        run: |
          test "$(cat /proc/sys/fs/binfmt_misc/status)" = disabled
          ulimit -c unlimited
          make check 2>&1 | tee "$RUNNER_TEMP/arm32-diagnostics/tests.log"

      - name: Collect debug artifacts and failure summary
        if: ${{ always() }}
        shell: bash
        env:
          CK_TEST_RESULTS: ${{ runner.temp }}/arm32-diagnostics/results.tsv
        run: |
          out="$RUNNER_TEMP/arm32-diagnostics"
          mkdir -p "$out"
          python3 - <<'PY'
          import csv
          import os
          from pathlib import Path

          results = Path(os.environ["CK_TEST_RESULTS"])
          rows = list(csv.reader(results.open(), delimiter="\t")) if results.exists() else []
          failed = [row for row in rows if row[1] != "0"]
          lines = [
              "## ARM32 regression results",
              f"{len(rows)} commands attempted; {len(failed)} failed.",
              "",
              "| Suite | Command | Exit status |",
              "| --- | --- | --- |",
          ]
          for suite, status, command in failed:
              lines.append(f"| `{suite}` | `{command}` | {status} |")
          summary = "\n".join(lines) + "\n"
          (results.parent / "summary.md").write_text(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write(summary)
          print(summary)
          PY
          for core in "$out"/cores/core.*; do
            test -f "$core" || continue
            binary=${core##*/core.}
            binary=${binary%.*}
            binary=${binary%.*}
            binary=${binary//!/\/}
            if ! gdb-multiarch --batch \
              -ex 'set pagination off' \
              -ex 'info registers' \
              -ex 'thread apply all bt full' \
              -ex "x/8i \$pc-16" \
              "$binary" "$core" > "$core.backtrace.txt" 2>&1; then
              echo "::warning::GDB could not fully analyze $core; see its backtrace log."
            fi
          done
          tar --exclude='./.git' -czf "$out/build.tar.gz" .
          tar -C / -czf "$out/armhf-runtime.tar.gz" \
            lib usr/lib/arm-linux-gnueabihf usr/lib/ld-linux-armhf.so.3

      - name: Upload ARM32 debug artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: arm32-debug-${{ matrix.cc }}
          path: ${{ runner.temp }}/arm32-diagnostics/
          compression-level: 0
          if-no-files-found: error

  # Temporarily skip regular builds while investigating native ARM32 support.
  linux:
    name: Linux ${{ matrix.arch }} / ${{ matrix.cc }}
    if: ${{ false }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        cc: [gcc, clang]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      # Fork pull requests run without repository secrets.
      - uses: bitbison-labs/github@master
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          instance: ${{ secrets.BITBISON_INSTANCE }}
          channel: ${{ secrets.BITBISON_CHANNEL }}
          token: ${{ secrets.BITBISON_TOKEN }}

      - uses: actions/checkout@v7

      - name: Install compilers
        run: sudo apt-get update && sudo apt-get install -y gcc clang

      - name: Compiler version
        run: ${{ matrix.cc }} --version

      - name: Build
        run: ./tools/ci-build.sh CC=${{ matrix.cc }} --cores=2

      - name: Test
        run: make check

  macos:
    name: macOS ${{ matrix.variant }}
    if: ${{ false }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: arm64
            runner: macos-latest    # Arm64
          - variant: x86_64
            runner: macos-15-intel  # x86-64
    steps:
      - uses: actions/checkout@v7
      - run: ./tools/ci-build.sh --cores=2
      - run: make check

  freebsd:
    name: "FreeBSD ${{ matrix.version }} / ${{ matrix.arch }} / ${{ matrix.cc }}"
    if: ${{ false }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['14.2', '15.0']
        arch: ['x86_64', 'aarch64']
        cc: ['clang', 'gcc']
    steps:
      - uses: actions/checkout@v7

      - name: Build & Test inside FreeBSD
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          release: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
          mem: 6144
          cpu: 2
          usesh: true
          sync: rsync
          prepare: |
            pkg install -y gcc gmake
          run: |
            ${{ matrix.cc }} --version
            ./tools/ci-build.sh CC=${{ matrix.cc }} --cores=2
            make check
