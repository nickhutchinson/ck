name: CI
on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
    inputs:
      fast:
        description: 'Fast build (Linux only)'
        type: boolean
        default: false

jobs:
  linux:
    name: Linux ${{ matrix.arch }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        cc: [gcc, clang]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      # Fork pull requests run without repository secrets.
      - uses: bitbison-labs/github@master
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          instance: ${{ secrets.BITBISON_INSTANCE }}
          channel: ${{ secrets.BITBISON_CHANNEL }}
          token: ${{ secrets.BITBISON_TOKEN }}

      - uses: actions/checkout@v7

      - name: Install compilers
        run: sudo apt-get update && sudo apt-get install -y gcc clang

      - name: Compiler version
        run: ${{ matrix.cc }} --version

      - name: Build
        run: ./tools/ci-build.sh CC=${{ matrix.cc }} --cores=2

      - name: Test
        run: make check

  macos:
    name: macOS ${{ matrix.variant }}
    if: ${{ !inputs.fast }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: arm64
            runner: macos-latest    # Arm64
          - variant: x86_64
            runner: macos-15-intel  # x86-64
    steps:
      - uses: actions/checkout@v7
      - run: ./tools/ci-build.sh --cores=2
      - run: make check

  freebsd:
    name: "FreeBSD ${{ matrix.version }} / ${{ matrix.arch }} / ${{ matrix.cc }}"
    if: ${{ !inputs.fast }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['13.3', '14.2', '15.0']
        arch: ['x86_64', 'aarch64']
        cc: ['clang', 'gcc']
    steps:
      - uses: actions/checkout@v7

      - name: Build & Test inside FreeBSD
        uses: vmactions/freebsd-vm@v1.5.0
        with:
          release: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
          mem: 6144
          cpu: 2
          usesh: true
          sync: rsync
          prepare: |
            pkg install -y gcc gmake
          run: |
            ${{ matrix.cc }} --version
            ./tools/ci-build.sh CC=${{ matrix.cc }} --cores=2
            make check

  windows_mingw:
    name: Windows MinGW / ${{ matrix.arch }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            compiler: gcc
            runner: windows-2025
            msys_subsystem: UCRT64
            CC: /c/mingw64/bin/x86_64-w64-mingw32-gcc
            AR: /c/mingw64/bin/x86_64-w64-mingw32-gcc-ar
          - arch: i686
            compiler: gcc
            runner: windows-2025
            msys_subsystem: MINGW32
            CC: /c/mingw32/bin/i686-w64-mingw32-gcc
            AR: /c/mingw32/bin/i686-w64-mingw32-gcc-ar
          - arch: aarch64
            compiler: clang
            runner: windows-11-arm
            msys_subsystem: CLANGARM64
            CC: $LLVM_MINGW_ROOT/bin/aarch64-w64-mingw32-clang
            AR: $LLVM_MINGW_ROOT/bin/aarch64-w64-mingw32-llvm-ar
    defaults:
      run:
        shell: c:\shells\msys2bash.cmd {0}
    env:
      MSYSTEM: ${{ matrix.msys_subsystem }}
    steps:
      - uses: actions/checkout@v7

      - name: Install build and runtime dependencies
        run: |
          pacman -Sy --noconfirm --needed \
            make \
            mingw-w64-ucrt-x86_64-libwinpthread \
            mingw-w64-i686-libwinpthread \
            mingw-w64-clang-aarch64-libwinpthread

      - name: Fetch llvm-mingw toolchain
        if: ${{ matrix.arch == 'aarch64' }}
        env:
          LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260908/llvm-mingw-20260908-ucrt-aarch64.zip
          LLVM_MINGW_SHA256: 7fe35f60407473c420ac72b25137f54385b0affd2c42efd507c0062fc626ab56
        run: |
          pushd "$RUNNER_TEMP"
          curl --fail --location --output llvm-mingw.zip "$LLVM_MINGW_URL"
          echo "$LLVM_MINGW_SHA256 *llvm-mingw.zip" | sha256sum -c

          mkdir llvm-mingw
          bsdtar -xf llvm-mingw.zip -C llvm-mingw --strip-components 1
          echo "LLVM_MINGW_ROOT=$(cygpath -a llvm-mingw)" >> $GITHUB_ENV

      - name: Compiler version
        run: ${{ matrix.CC }} --version

      - name: Build
        run: |
          ./tools/ci-build.sh \
            --cores=2 \
            --platform=${{ matrix.arch }} \
            CC=${{ matrix.CC }} \
            AR=${{ matrix.AR }}

      - name: Test
        run: make check

  windows_visual_studio:
    name: Windows VS / ${{ matrix.target.arch }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - msvc
          - clang
        target:
          - arch: x86_64
            vs_arch: amd64
            vs_host_arch: amd64
            runner: windows-2025
          - arch: i686
            vs_arch: x86
            vs_host_arch: amd64
            runner: windows-2025
          - arch: aarch64
            vs_arch: arm64
            vs_host_arch: arm64
            runner: windows-11-arm
    env:
      VSCMD_SKIP_SENDTELEMETRY: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Build and test
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          Write-Host "+ '$vswhere' -latest -products '*' -property installationPath"
          $vsRoot = & $vswhere -latest -products '*' -property installationPath
          if (-not $vsRoot) { throw 'Could not find Visual Studio' }

          & "$vsRoot\Common7\Tools\Launch-VsDevShell.ps1" `
            -Arch ${{ matrix.target.vs_arch }} `
            -HostArch ${{ matrix.target.vs_host_arch }} `
            -SkipAutomaticLocation -NoLogo

          Write-Output '::group::Compiler version'
          Write-Host '+ cl'
          cl
          Write-Host '+ clang-cl --version'
          clang-cl --version
          Write-Output '::endgroup::'

          Write-Output '::group::Configure'
          $cmakeArgs = @('-S', '.', '-B', 'out', '-G', 'Ninja', '-DCMAKE_BUILD_TYPE=RelWithDebInfo')
          if ('${{ matrix.compiler }}' -eq 'msvc') {
            $cmakeArgs += '-DCMAKE_C_COMPILER=cl'
          } else {
            $cmakeArgs += '-DCMAKE_C_COMPILER=clang-cl'
            $cmakeArgs += '-DCMAKE_C_COMPILER_TARGET=${{ matrix.target.arch }}-pc-windows-msvc'
          }
          Write-Host "+ cmake $($cmakeArgs -join ' ')"
          cmake @cmakeArgs
          Write-Output '::endgroup::'

          Write-Output '::group::Build'
          Write-Host '+ cmake --build out --verbose'
          cmake --build out --verbose
          Write-Output '::endgroup::'

          Write-Output '::group::Test'
          Write-Host '+ cmake --build out --target regressions --verbose'
          cmake --build out --target regressions --verbose
          Write-Host '+ ctest --test-dir out -V'
          ctest --test-dir out -V
          Write-Output '::endgroup::'
