name: CI
on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
    inputs:
      fast:
        description: 'Fast build (native Linux only)'
        type: boolean
        default: false

jobs:
  linux:
    name: Linux ${{ matrix.arch }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        cc: [gcc, clang]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      # Fork pull requests run without repository secrets.
      - uses: bitbison-labs/github@master
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          instance: ${{ secrets.BITBISON_INSTANCE }}
          channel: ${{ secrets.BITBISON_CHANNEL }}
          token: ${{ secrets.BITBISON_TOKEN }}

      - uses: actions/checkout@v7

      - name: Install compilers
        run: sudo apt-get update && sudo apt-get install -y gcc clang

      - name: Compiler version
        run: ${{ matrix.cc }} --version

      - name: Build
        run: ./tools/ci-build.sh CC=${{ matrix.cc }} --cores=2

      - name: Test
        run: make check

  linux_arm32:
    name: Linux arm32 / ${{ matrix.cc }}
    if: ${{ !inputs.fast }}
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      # Fork pull requests run without repository secrets.
      - uses: bitbison-labs/github@master
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          instance: ${{ secrets.BITBISON_INSTANCE }}
          channel: ${{ secrets.BITBISON_CHANNEL }}
          token: ${{ secrets.BITBISON_TOKEN }}

      - uses: actions/checkout@v7

      - name: Install compilers
        run: |
          set -x

          # Add explicit architecture for the default sources.
          sudo sed -i '/^Architectures:/d; /^Types:/a Architectures: arm64' /etc/apt/sources.list.d/ubuntu.sources

          # Add sources for the armhf libc headers and runtime.
          sudo tee /etc/apt/sources.list.d/armhf.sources <<'EOF'
          Types: deb
          URIs: http://azure.ports.ubuntu.com/ubuntu-ports/
          Suites: resolute resolute-updates resolute-backports resolute-security
          Components: main universe restricted multiverse
          Architectures: armhf
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo dpkg --add-architecture armhf
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf clang libc6:armhf libc6-dev:armhf

          # Match Ubuntu GCC armhf's defaults. 
          clang_bin_dir=$(dirname "$(realpath /usr/bin/clang)")
          sudo tee "$clang_bin_dir"/arm-unknown-linux-gnueabihf.cfg <<'EOF'
          -mthumb
          -D_TIME_BITS=64
          -D_FILE_OFFSET_BITS=64
          EOF

          sudo ln -s /usr/bin/clang /usr/local/bin/arm-linux-gnueabihf-clang

      - name: Compiler version
        run: arm-linux-gnueabihf-${{ matrix.cc }} --version

      - name: Build
        run: |
          ./tools/ci-build.sh \
            CC=arm-linux-gnueabihf-${{ matrix.cc }} AR=arm-linux-gnueabihf-ar \
            --platform=arm --cores=2

      - name: Test
        run: make check

  macos:
    name: macOS ${{ matrix.variant }}
    if: ${{ !inputs.fast }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: arm64
            runner: macos-latest    # Arm64
          - variant: x86_64
            runner: macos-15-intel  # x86-64
    steps:
      - uses: actions/checkout@v7
      - run: ./tools/ci-build.sh --cores=2
      - run: make check

  freebsd:
    name: "FreeBSD ${{ matrix.version }} / ${{ matrix.arch }} / ${{ matrix.cc }}"
    if: ${{ !inputs.fast }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['14.2', '15.0']
        arch: ['x86_64', 'aarch64']
        cc: ['clang', 'gcc']
    steps:
      - uses: actions/checkout@v7

      - name: Build & Test inside FreeBSD
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          release: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
          mem: 6144
          cpu: 2
          usesh: true
          sync: rsync
          prepare: |
            pkg install -y gcc gmake
          run: |
            ${{ matrix.cc }} --version
            ./tools/ci-build.sh CC=${{ matrix.cc }} --cores=2
            make check
