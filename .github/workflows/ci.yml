name: CI
on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
    inputs:
      fast:
        description: 'Fast build (Linux only)'
        type: boolean
        default: false

jobs:
  arm32_probe:
    name: Linux ARM64 / native ARM32 probe
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    steps:
      - name: Inspect runner and rule out emulation
        shell: bash
        run: |
          uname -a
          lscpu
          test "$(uname -m)" = aarch64
          if ! mountpoint -q /proc/sys/fs/binfmt_misc; then
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          fi
          for handler in /proc/sys/fs/binfmt_misc/*; do
            case "$handler" in
              */register|*/status) continue ;;
            esac
            test -f "$handler" || continue
            echo "binfmt_misc handler: $handler"
            cat "$handler"
            if grep -qx enabled "$handler"; then
              echo "::error::Enabled binfmt_misc handler; cannot establish native ARM32 execution."
              exit 1
            fi
          done

      - name: Inspect apt sources and install ARMHF compiler and libc
        shell: bash
        run: |
          dpkg --print-architecture
          dpkg --print-foreign-architectures
          test "$(dpkg --print-architecture)" = arm64
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            test -f "$source" || continue
            echo "apt source: $source"
            cat "$source"
          done
          sudo dpkg --add-architecture armhf
          sudo apt-get update
          apt-cache policy gcc-arm-linux-gnueabihf libc6:armhf libc6-dev:armhf
          sudo apt-get install -y gcc-arm-linux-gnueabihf libc6:armhf libc6-dev:armhf file
          test -r /lib/ld-linux-armhf.so.3
          file /lib/ld-linux-armhf.so.3

      - name: Compile and execute ARM32 program
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/arm32-probe.c" <<'EOF'
          #include <stdio.h>

          #if !defined(__arm__) || !defined(__ARM_PCS_VFP)
          #error Expected an ARM32 hard-float target
          #endif
          _Static_assert(sizeof(void *) == 4, "Expected 32-bit pointers");
          _Static_assert(sizeof(long) == 4, "Expected 32-bit long");

          int main(void)
          {
              printf("Native ARM32 execution succeeded: pointer=%zu bits, long=%zu bits\n",
                  sizeof(void *) * 8, sizeof(long) * 8);
              return 0;
          }
          EOF
          arm-linux-gnueabihf-gcc -std=c11 -O2 -Wall -Wextra -Werror \
            "$RUNNER_TEMP/arm32-probe.c" -o "$RUNNER_TEMP/arm32-probe"
          file "$RUNNER_TEMP/arm32-probe"
          arm-linux-gnueabihf-readelf -h -l "$RUNNER_TEMP/arm32-probe"
          "$RUNNER_TEMP/arm32-probe"

  # Temporarily skip regular builds while investigating native ARM32 support.
  linux:
    name: Linux ${{ matrix.arch }} / ${{ matrix.cc }}
    if: ${{ false }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        cc: [gcc, clang]
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      # Fork pull requests run without repository secrets.
      - uses: bitbison-labs/github@master
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          instance: ${{ secrets.BITBISON_INSTANCE }}
          channel: ${{ secrets.BITBISON_CHANNEL }}
          token: ${{ secrets.BITBISON_TOKEN }}

      - uses: actions/checkout@v7

      - name: Install compilers
        run: sudo apt-get update && sudo apt-get install -y gcc clang

      - name: Compiler version
        run: ${{ matrix.cc }} --version

      - name: Build
        run: ./tools/ci-build.sh CC=${{ matrix.cc }} --cores=2

      - name: Test
        run: make check

  macos:
    name: macOS ${{ matrix.variant }}
    if: ${{ false }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: arm64
            runner: macos-latest    # Arm64
          - variant: x86_64
            runner: macos-15-intel  # x86-64
    steps:
      - uses: actions/checkout@v7
      - run: ./tools/ci-build.sh --cores=2
      - run: make check

  freebsd:
    name: "FreeBSD ${{ matrix.version }} / ${{ matrix.arch }} / ${{ matrix.cc }}"
    if: ${{ false }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['14.2', '15.0']
        arch: ['x86_64', 'aarch64']
        cc: ['clang', 'gcc']
    steps:
      - uses: actions/checkout@v7

      - name: Build & Test inside FreeBSD
        uses: vmactions/freebsd-vm@v1.5.9
        with:
          release: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
          mem: 6144
          cpu: 2
          usesh: true
          sync: rsync
          prepare: |
            pkg install -y gcc gmake
          run: |
            ${{ matrix.cc }} --version
            ./tools/ci-build.sh CC=${{ matrix.cc }} --cores=2
            make check
